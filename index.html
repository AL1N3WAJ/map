<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bangladesh Volunteer Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin:0; padding:0; font-family: Arial, sans-serif; }
    #map { height: 100vh; width: 100%; }
    .sidebar {
      position: absolute; top: 0; left: 0; width: 300px; height: 100vh;
      background: white; box-shadow: 3px 0 10px rgba(0,0,0,0.3);
      z-index: 1000; padding: 15px; overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h1>Bangladesh Volunteers</h1>
    <p><strong>Total Volunteers: 23</strong></p>
    <p>Upload your data folder to make it fully working.</p>
  </div>

  <div style="margin-left: 300px;">
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', {minZoom:7, maxZoom:13}).setView([23.685, 90.356], 7);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    // Simple Bangladesh boundary (for testing)
    const bdBounds = [[20.5, 88.0], [26.7, 92.7]];
    map.fitBounds(bdBounds);
    map.setMaxBounds(bdBounds);

    L.marker([23.8103, 90.4125]).addTo(map).bindPopup("Dhaka - 8 Volunteers");
    L.marker([22.3569, 91.7832]).addTo(map).bindPopup("Chittagong - 4 Volunteers");
  </script>
</body>
</html>
