<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bangladesh Volunteer Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin:0; padding:0; font-family: Arial, sans-serif; overflow: hidden; }
    #map { height: 100vh; width: 100%; }
    .sidebar {
      position: absolute; top: 0; left: 0; width: 320px; height: 100vh;
      background: white; box-shadow: 2px 0 10px rgba(0,0,0,0.2);
      z-index: 1000; overflow-y: auto; padding: 15px;
    }
    .main-content { margin-left: 320px; }
    h1 { margin: 0 0 15px 0; font-size: 1.4em; color: #333; }
    .search-box { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; }
    .volunteer-list { list-style: none; padding: 0; }
    .volunteer-list li { padding: 8px; border-bottom: 1px solid #eee; cursor: pointer; }
    .volunteer-list li:hover { background: #f0f0f0; }
  </style>
</head>
<body>
  <div class="sidebar">
    <h1>Bangladesh Volunteers</h1>
    <input type="text" id="search" class="search-box" placeholder="Search district or name...">
    <div><strong>Total Volunteers: <span id="total-count">0</span></strong></div>
    <ul class="volunteer-list" id="volunteer-list"></ul>
  </div>

  <div class="main-content">
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

  <script>
    // Initialize map
    const map = L.map('map', {
      minZoom: 7,
      maxZoom: 13,
      zoomControl: true
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    let geoLayer;

    async function loadMap() {
      const geojson = await fetch('data/bd-districts.geojson').then(r => r.json());

      geoLayer = L.geoJSON(geojson, {
        style: feature => {
          const name = feature.properties.name || feature.properties.NAME || '';
          return {
            fillColor: '#FEB24C',
            weight: 1.5,
            color: 'white',
            fillOpacity: 0.75
          };
        },
        onEachFeature: (feature, layer) => {
          const name = feature.properties.name || feature.properties.NAME || 'Unknown';
          layer.bindPopup(`<h3>${name}</h3>`);
        }
      }).addTo(map);

      // === TIGHT CROP TO BANGLADESH ONLY ===
      const bounds = geoLayer.getBounds();
      map.fitBounds(bounds, { padding: [40, 40] });   // Tight fit
      map.setMaxBounds(bounds);                       // Prevent panning outside

      // Optional: Hide tiles outside Bangladesh (visual cut effect)
      map.on('moveend', () => {
        if (map.getBounds().getNorth() > bounds.getNorth() + 1) map.fitBounds(bounds);
      });
    }

    loadMap();
  </script>
</body>
</html>
